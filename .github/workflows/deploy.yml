name: Deploy Biblioteca

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout codigo
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compilar proyecto
        run: |
          chmod +x mvnw
          ./mvnw -B clean package -DskipTests
      
      - name: Copiar JARs a la instancia EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT || 22 }}
          source: |
            eureka/target/cl-triskeledu-eureka-1.0-SNAPSHOT.jar
            ms-usuarios/target/cl-triskeledu-usuarios-0.0.1-SNAPSHOT.jar
            ms-catalogo/target/cl-triskeledu-catalogo-0.0.1-SNAPSHOT.jar
            ms-recursos/target/cl-triskeledu-recursos-0.0.1-SNAPSHOT.jar
            api-gateway/target/cl-triskeledu-gateway-0.0.1-SNAPSHOT.jar
          target: /home/${{ secrets.EC2_USER }}/micros
          strip_components: 2